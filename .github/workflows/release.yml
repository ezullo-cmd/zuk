# Ad ogni push su "main" viene creata una nuova versione dell'app (1.0.<numero build>),
# compilata per Windows/Linux e pubblicata come GitHub Release.
# L'app installata la rileva all'avvio e propone l'aggiornamento automatico.
name: Build & Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  VERSION: 1.0.${{ github.run_number }}

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Crea release in bozza
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MSG: ${{ github.event.head_commit.message || 'avvio manuale' }}
        run: |
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --draft \
            --title "v$VERSION" \
            --notes "Build automatica da ${GITHUB_SHA::7}: $COMMIT_MSG"

  build:
    needs: create-release
    strategy:
      fail-fast: true
      matrix:
        # Per macOS aggiungi "macos-latest": l'aggiornamento automatico su Mac richiede la firma del codice.
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Imposta versione
        run: npm version "${{ env.VERSION }}" --no-git-tag-version --allow-same-version

      - name: Build e upload sulla release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --publish always

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Pubblica la release (la rende visibile agli aggiornamenti)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest

  cleanup:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Tieni solo le ultime 2 release (le altre vengono eliminate con i loro tag)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[2:] | .[].tagName' |
          while read -r tag; do
            echo "Elimino la release $tag"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done
