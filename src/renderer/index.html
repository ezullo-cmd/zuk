<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Zuk Gestionale</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="update-banner" class="update-banner hidden"></div>

  <div class="layout">
    <aside class="sidebar">
      <div class="brand">Zuk <span>Gestionale</span></div>
      <nav>
        <a href="#" data-route="home" class="nav-item"><span class="ic ic-home"></span> Home</a>
        <div class="nav-section">
          <span>Clienti</span>
          <button id="btn-new-cliente" class="icon-btn" title="Nuovo cliente">＋</button>
        </div>
        <input id="search-clienti" class="search" placeholder="Cerca cliente…">
        <div id="clienti-menu" class="clienti-menu"></div>
      </nav>
      <div class="sidebar-footer">
        <button id="wa-btn" class="wa-status" type="button"><span class="wa-dot"></span><span id="wa-label">Connetti WhatsApp Web</span></button>
        <a href="#" data-route="settings" class="nav-item"><span class="ic ic-settings"></span> Impostazioni</a>
        <div class="version">v<span id="app-version">—</span></div>
      </div>
    </aside>

    <main id="content" class="content"></main>
  </div>

  <dialog id="modal">
    <form id="modal-form" method="dialog">
      <h2 id="modal-title"></h2>
      <div id="modal-body" class="form-grid"></div>
      <div class="modal-actions">
        <button type="button" class="btn ghost" id="modal-cancel">Annulla</button>
        <button type="submit" class="btn primary">Salva</button>
      </div>
    </form>
  </dialog>

  <dialog id="wa-dialog">
    <h2>WhatsApp Web</h2>
    <div id="wa-body"></div>
    <div class="modal-actions" id="wa-actions"></div>
  </dialog>

  <div id="toast" class="toast hidden"></div>
  <script src="app.js"></script>
  <script src="anagrafica.js"></script>
  <script src="appuntamenti.js"></script>
  <script src="pagamenti.js"></script>
  <script src="acquisti.js"></script>
</body>
</html>
